services:
  nextroom:
    build: .
    restart: unless-stopped
    ports:
      - "8767:8767"
      - "8768:8768"
    env_file:
      - path: apps/server/.env
        required: false
    environment:
      # The characters' computers join this network, where the app reaches their screens.
      NEXTROOM_DOCKER_NETWORK: nextroom
    volumes:
      - data:/data
      - /var/run/docker.sock:/var/run/docker.sock
    extra_hosts:
      - host.docker.internal:host-gateway

networks:
  default:
    name: nextroom

volumes:
  data:
    name: nextroom-data
