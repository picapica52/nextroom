<!doctype html>
<html lang="ja">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<title>Desktop</title>
		<style>
			html,
			body,
			#screen {
				margin: 0;
				width: 100%;
				height: 100%;
				overflow: hidden;
				background: #1f1f1f;
			}
		</style>
	</head>
	<body>
		<div id="screen"></div>
		<script type="module">
			import RFB from "./core/rfb.js";

			// ?mode=control takes over; anything else only watches.
			const control = new URLSearchParams(location.search).get("mode") === "control";
			const base = location.pathname.replace(/[^/]*$/, "");
			const scheme = location.protocol === "https:" ? "wss" : "ws";
			const url = `${scheme}://${location.host}${base}websockify?token=${control ? "control" : "view"}`;

			function connect() {
				const rfb = new RFB(document.getElementById("screen"), url, { wsProtocols: [] });
				rfb.viewOnly = !control;
				rfb.scaleViewport = true;
				rfb.background = "#1f1f1f";
				rfb.addEventListener("disconnect", () => setTimeout(connect, 2000));
			}
			connect();
		</script>
	</body>
</html>
