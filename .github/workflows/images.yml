# Publishes the app's image and the characters' computer image to GHCR on every push to main.
name: images

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: images-${{ github.ref }}
  cancel-in-progress: false

jobs:
  app:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:latest
            ghcr.io/${{ github.repository }}:sha-${{ github.sha }}
          labels: org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          cache-from: type=gha,scope=app
          cache-to: type=gha,mode=max,scope=app

  desktop-tag:
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.tag.outputs.image }}
      found: ${{ steps.exists.outputs.found }}
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - id: tag
        run: echo "image=$(bun packages/api/src/agent/tools/desktop-image.ts)" >>"$GITHUB_OUTPUT"
      - id: exists
        run: |
          if docker manifest inspect "${{ steps.tag.outputs.image }}" >/dev/null 2>&1; then
            echo "found=true" >>"$GITHUB_OUTPUT"
          fi

  # Each architecture on its own runner: arm64 under QEMU takes far too long (apt, Chromium).
  desktop:
    needs: desktop-tag
    if: needs.desktop-tag.outputs.found != 'true'
    strategy:
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: arch
        run: echo "name=${PLATFORM#linux/}" >>"$GITHUB_OUTPUT"
        env:
          PLATFORM: ${{ matrix.platform }}
      - uses: docker/build-push-action@v6
        with:
          context: packages/api/desktop
          platforms: ${{ matrix.platform }}
          push: true
          tags: ${{ needs.desktop-tag.outputs.image }}-${{ steps.arch.outputs.name }}
          labels: org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          provenance: false
          cache-from: type=gha,scope=desktop-${{ steps.arch.outputs.name }}
          cache-to: type=gha,mode=max,scope=desktop-${{ steps.arch.outputs.name }}

  desktop-manifest:
    needs: [desktop-tag, desktop]
    runs-on: ubuntu-latest
    steps:
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - run: docker buildx imagetools create -t "$IMAGE" "$IMAGE-amd64" "$IMAGE-arm64"
        env:
          IMAGE: ${{ needs.desktop-tag.outputs.image }}
