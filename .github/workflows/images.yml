# Publishes the app's image and the characters' computer image to GHCR on every push to main.
name: images

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: images-${{ github.ref }}
  cancel-in-progress: false

jobs:
  app:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:latest
            ghcr.io/${{ github.repository }}:sha-${{ github.sha }}
          labels: org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          cache-from: type=gha,scope=app
          cache-to: type=gha,mode=max,scope=app

  desktop:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - id: tag
        run: echo "image=$(bun packages/api/src/agent/tools/desktop-image.ts)" >>"$GITHUB_OUTPUT"
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: exists
        run: |
          if docker manifest inspect "${{ steps.tag.outputs.image }}" >/dev/null 2>&1; then
            echo "found=true" >>"$GITHUB_OUTPUT"
          fi
      - if: steps.exists.outputs.found != 'true'
        uses: docker/setup-qemu-action@v3
      - if: steps.exists.outputs.found != 'true'
        uses: docker/setup-buildx-action@v3
      - if: steps.exists.outputs.found != 'true'
        uses: docker/build-push-action@v6
        with:
          context: packages/api/desktop
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.tag.outputs.image }}
          labels: org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          cache-from: type=gha,scope=desktop
          cache-to: type=gha,mode=max,scope=desktop
